[recipe]
version = 0
name = "jupiter_demo"

[lights]
paths = ["data/jupiter.ser"]
start_frame = 0
frame_step = 1
end_frame = 300
debayer = "bilinear"

[darks]
paths = ["data/darks.ser"]

[align]
center_of_mass = true
crop = [512, 512]
crop_align = 2
crop_offsets = [0, 0]

[lucky_scoring]
metric = "fourier_bandpass"
min_wavelength_pixels = 5.0
max_wavelength_pixels = 50.0

[lucky_stack]
top_fractions = [0.1]

[local_lucky]
algorithm = "frequency_bands"
noise_wavelength_pixels = 2.0
crossover_wavelength_pixels = 35.0
isoplanatic_patch_pixels = 55.0
channel_crosstalk = 0.0
stdevs_above_mean = 2.5
steepness = 3.0

[mfbd]
method = "torchmfbd"
frames = "lucky_top"
top_n = 12
diameter_cm = 20.0
central_obscuration_cm = 0.0
pixel_scale_arcsec = 0.25
wavelengths_nm = [700.0, 530.0, 470.0]
psf_model = "kl"
n_modes = 20
iterations = 100
optimizer = "adam"
lr_obj = 0.02
lr_modes = 0.08
apodization_border = 0
frequency_cutoff = [0.2, 0.3]

[output]
dir = "output"
debug_frames = 10
